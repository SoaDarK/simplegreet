
name: Java CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: myapp/pom.xml

      - name: Install SQL Server JDBC driver
        run: |
          mvn install:install-file \
            -Dfile=myapp/mssqljdbc/sqljdbc42.jar \
            -DgroupId=com.microsoft.sqlserver \
            -DartifactId=sqljdbc4 \
            -Dversion=6.0 \
            -Dpackaging=jar

      - name: Build application with Maven
        run: mvn -B package --file myapp/pom.xml

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: simplegreet-war
          path: myapp/target/*.war

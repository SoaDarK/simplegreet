
name: Greetings.Provisioning

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: "Apply infrastructure changes (false = dry run)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate YAML
        run: |
          ruby -e '
            require "yaml"
            ["dev", "prod"].each do |env|
              file = "infrastructure/simplegreet-#{env}.yaml"
              data = YAML.load_file(file)
              abort "Wrong service name" unless data.dig("metadata", "name") == "simplegreet-#{env}"
              puts "Validated: #{file}"
            end
          '

  provision-dev:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Use current Dev image
        run: |
          CURRENT=$(gcloud run services describe simplegreet-dev \
            --project=project-cbc9d26b-b660-435d-bed \
            --region=europe-west1 \
            --format="value(spec.template.spec.containers[0].image)")

          test -n "$CURRENT" || {
            echo "Error: Current Dev image not found"
            exit 1
          }

          CURRENT_IMAGE="$CURRENT" ruby -ryaml -e '
            path = "infrastructure/simplegreet-dev.yaml"
            data = YAML.load_file(path)
            data["spec"]["template"]["spec"]["containers"][0]["image"] = ENV.fetch("CURRENT_IMAGE")
            File.write(path, YAML.dump(data))
          '

          echo "Dev image synchronized successfully"

      - name: Provision Dev
        run: |
          if [[ "${{ inputs.apply_changes }}" == "true" ]]; then
            gcloud run services replace \
              infrastructure/simplegreet-dev.yaml \
              --project=project-cbc9d26b-b660-435d-bed \
              --region=europe-west1
          else
            gcloud run services replace \
              infrastructure/simplegreet-dev.yaml \
              --project=project-cbc9d26b-b660-435d-bed \
              --region=europe-west1 \
              --dry-run
          fi

  provision-prod:
    needs: provision-dev
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Use current Production image
        run: |
          CURRENT=$(gcloud run services describe simplegreet-prod \
            --project=project-cbc9d26b-b660-435d-bed \
            --region=europe-west1 \
            --format="value(spec.template.spec.containers[0].image)")

          test -n "$CURRENT" || {
            echo "Error: Current Production image not found"
            exit 1
          }

          CURRENT_IMAGE="$CURRENT" ruby -ryaml -e '
            path = "infrastructure/simplegreet-prod.yaml"
            data = YAML.load_file(path)
            data["spec"]["template"]["spec"]["containers"][0]["image"] = ENV.fetch("CURRENT_IMAGE")
            File.write(path, YAML.dump(data))
          '

          echo "Production image synchronized successfully"

      - name: Provision Production
        run: |
          if [[ "${{ inputs.apply_changes }}" == "true" ]]; then
            gcloud run services replace \
              infrastructure/simplegreet-prod.yaml \
              --project=project-cbc9d26b-b660-435d-bed \
              --region=europe-west1
          else
            gcloud run services replace \
              infrastructure/simplegreet-prod.yaml \
              --project=project-cbc9d26b-b660-435d-bed \
              --region=europe-west1 \
              --dry-run
          fi
